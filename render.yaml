databases:
  - name: sports-injury-db
    databaseName: sports_injury_db
    user: postgres
    region: oregon
    plan: starter

services:
  # ======================================================================
  # Backend API Service (FastAPI + OpenCV + MediaPipe + Persistent Disk)
  # ======================================================================
  - type: web
    name: sports-injury-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    disk:
      name: sports-storage
      mountPath: /var/data
      sizeGB: 10
    dockerCommand: sh -c "mkdir -p /var/data/uploads /var/data/processed_videos /var/data/reports && ln -sfn /var/data/uploads /app/uploads && ln -sfn /var/data/processed_videos /app/processed_videos && ln -sfn /var/data/reports /app/reports && (python seed_admin.py || true) && exec uvicorn main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sports-injury-db
          property: connectionString
      - key: STORAGE_DIR
        value: /var/data
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: https://sports-injury-frontend.onrender.com
      - key: BACKEND_PUBLIC_BASE_URL
        value: https://sports-injury-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://sports-injury-frontend.onrender.com
      - key: GOOGLE_CLIENT_ID
        value: 236706862408-9p94cb371imoelc3s6as6ottl2f83ges.apps.googleusercontent.com
      # Enter this one secret in Render's dashboard to prevent GitHub exposure:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_EMAIL
        value: varshinaidu005@gmail.com
      - key: SMTP_APP_PASSWORD
        value: cplxrghnvbaxlaqk
      - key: ADMIN_NAME
        value: VeeraNagaDurga
      - key: ADMIN_EMAIL
        value: admindurga005@gmail.com
      - key: ADMIN_PASSWORD
        value: GVND2006

  # ======================================================================
  # Frontend Static Service (React 19 SPA)
  # ======================================================================
  - type: static
    name: sports-injury-frontend
    region: oregon
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    publishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://sports-injury-backend.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 236706862408-9p94cb371imoelc3s6as6ottl2f83ges.apps.googleusercontent.com
